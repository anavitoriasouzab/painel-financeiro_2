<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Entrar — Painel Financeiro</title>
<link rel="icon" type="image/svg+xml" href="assets/pf-favicon.svg" />
<script>
  // Mesma lógica do index.html — dark é o padrão, só fica claro se escolhido explicitamente.
  if (localStorage.getItem('financas_theme') !== 'light') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-body">

<div class="auth-shell">

  <canvas class="auth-shader-canvas shader-canvas" aria-hidden="true"></canvas>

  <div class="auth-panel">
    <div class="auth-card">

      <div class="auth-brand">
        <img class="auth-brand-mark" src="assets/pf-mark.svg" alt="" width="34" height="34" />
        <span>Painel Financeiro</span>
      </div>

      <div class="segmented auth-toggle" id="auth-mode-toggle">
        <button type="button" data-mode="login" class="active">Entrar</button>
        <button type="button" data-mode="signup">Criar conta</button>
      </div>

      <h1 id="auth-title">Bem-vindo(a) de volta</h1>
      <p class="auth-lede" id="auth-lede">Entre com seu e-mail para acessar seu painel.</p>

      <div class="auth-message" id="auth-message" role="alert"></div>

      <button type="button" class="auth-google-btn" id="auth-google-btn">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.87 2.7-6.62Z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18Z"/>
          <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33Z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58Z"/>
        </svg>
        <span id="auth-google-label">Continuar com o Google</span>
      </button>

      <div class="auth-divider"><span>ou</span></div>

      <form class="auth-form" id="auth-form" novalidate>
        <div class="field" id="field-nome" style="display:none;">
          <label for="auth-nome">Como quer ser chamada(o)?</label>
          <div class="auth-input-wrap">
            <svg class="auth-input-icon" viewBox="0 -960 960 960" width="17" height="17" fill="currentColor"><path d="M372-523q-42-42-42-108t42-108q42-42 108-42t108 42q42 42 42 108t-42 108q-42 42-108 42t-108-42ZM160-160v-94q0-38 19-65t49-41q67-30 128.5-45T480-420q62 0 123 15.5T731-360q31 14 50 41t19 65v94H160Zm60-60h520v-34q0-16-9.5-30.5T707-306q-64-31-117-42.5T480-360q-57 0-111 11.5T252-306q-14 7-23 21.5t-9 30.5v34Zm324.5-346.5Q570-592 570-631t-25.5-64.5Q519-721 480-721t-64.5 25.5Q390-670 390-631t25.5 64.5Q441-541 480-541t64.5-25.5ZM480-631Zm0 411Z"/></svg>
            <input id="auth-nome" type="text" placeholder="Seu nome" autocomplete="name" />
          </div>
        </div>

        <div class="field">
          <label for="auth-email">E-mail</label>
          <div class="auth-input-wrap">
            <svg class="auth-input-icon" viewBox="0 -960 960 960" width="17" height="17" fill="currentColor"><path d="M140-160q-24 0-42-18t-18-42v-520q0-24 18-42t42-18h680q24 0 42 18t18 42v520q0 24-18 42t-42 18H140Zm340-302L140-685v465h680v-465L480-462Zm0-60 336-218H145l335 218ZM140-685v-55 520-465Z"/></svg>
            <input id="auth-email" type="email" placeholder="voce@email.com" autocomplete="email" required />
          </div>
        </div>

        <div class="field">
          <label for="auth-senha">Senha</label>
          <div class="auth-input-wrap auth-password-wrap">
            <svg class="auth-input-icon" viewBox="0 -960 960 960" width="17" height="17" fill="currentColor"><path d="M220-80q-24.75 0-42.37-17.63Q160-115.25 160-140v-434q0-24.75 17.63-42.38Q195.25-634 220-634h70v-96q0-78.85 55.61-134.42Q401.21-920 480.11-920q78.89 0 134.39 55.58Q670-808.85 670-730v96h70q24.75 0 42.38 17.62Q800-598.75 800-574v434q0 24.75-17.62 42.37Q764.75-80 740-80H220Zm0-60h520v-434H220v434Zm314.5-162.03Q557-324.06 557-355q0-30-22.67-54.5t-54.5-24.5q-31.83 0-54.33 24.5t-22.5 55q0 30.5 22.67 52.5t54.5 22q31.83 0 54.33-22.03ZM350-634h260v-96q0-54.17-37.88-92.08-37.88-37.92-92-37.92T388-822.08q-38 37.91-38 92.08v96ZM220-140v-434 434Z"/></svg>
            <input id="auth-senha" type="password" placeholder="Mínimo 6 caracteres" autocomplete="current-password" minlength="6" required />
            <button type="button" class="auth-eye-btn" id="auth-toggle-senha" aria-label="Mostrar ou ocultar senha">
              <svg class="icon-eye-open" viewBox="0 -960 960 960" width="18" height="18" fill="currentColor"><path d="M607.5-372.5Q660-425 660-500t-52.5-127.5Q555-680 480-680t-127.5 52.5Q300-575 300-500t52.5 127.5Q405-320 480-320t127.5-52.5Zm-204-51Q372-455 372-500t31.5-76.5Q435-608 480-608t76.5 31.5Q588-545 588-500t-31.5 76.5Q525-392 480-392t-76.5-31.5ZM214-281.5Q94-363 40-500q54-137 174-218.5T480-800q146 0 266 81.5T920-500q-54 137-174 218.5T480-200q-146 0-266-81.5ZM480-500Zm207.5 160.5Q782-399 832-500q-50-101-144.5-160.5T480-720q-113 0-207.5 59.5T128-500q50 101 144.5 160.5T480-280q113 0 207.5-59.5Z"/></svg>
              <svg class="icon-eye-closed" viewBox="0 -960 960 960" width="18" height="18" fill="currentColor" style="display:none;"><path d="m644-428-58-58q9-47-27-88t-93-32l-58-58q17-8 34.5-12t37.5-4q75 0 127.5 52.5T660-500q0 20-4 37.5T644-428Zm128 126-58-56q38-29 67.5-63.5T832-500q-50-101-143.5-160.5T480-720q-29 0-57 4t-55 12l-62-62q41-17 84-25.5t90-8.5q151 0 269 83.5T920-500q-23 59-60.5 109.5T772-302Zm20 246L624-222q-35 11-70.5 16.5T480-200q-151 0-269-83.5T40-500q21-53 53-98.5t73-81.5L56-792l56-56 736 736-56 56ZM222-624q-29 26-53 57t-41 67q50 101 143.5 160.5T480-280q20 0 39-2.5t39-5.5l-36-38q-11 3-21 4.5t-21 1.5q-75 0-127.5-52.5T300-500q0-11 1.5-21t4.5-21l-84-82Zm319 93Zm-151 75Z"/></svg>
            </button>
          </div>
        </div>

        <div class="field field-checkbox" id="field-termos" style="display:none;">
          <label>
            <input type="checkbox" id="auth-termos" />
            <span>Li e aceito os <a class="text-link" href="termos.html" target="_blank" rel="noopener">Termos de Uso</a> e a
              <a class="text-link" href="privacidade.html" target="_blank" rel="noopener">Política de Privacidade</a></span>
          </label>
        </div>

        <div class="auth-row-between">
          <span></span>
          <button type="button" class="auth-link" id="auth-forgot-link">Esqueci minha senha</button>
        </div>

        <button type="submit" class="primary-btn auth-submit" id="auth-submit-btn">
          <span class="auth-spinner"></span>
          <span class="auth-submit-label" id="auth-submit-label">Entrar</span>
        </button>
      </form>

      <div class="auth-switch" id="auth-switch-line">
        Ainda não tem conta? <button type="button" class="auth-link" id="auth-switch-link">Criar conta</button>
      </div>

      <p class="auth-footnote">Seus dados financeiros ficam salvos na sua conta, protegidos por login — só você tem acesso a eles.</p>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/shader-background.js"></script>
</body>
</html>
